<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SPIRIT_GROVE.EXE — Terminal Protocol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game"></canvas>
<div id="scanlines"></div>
<div id="vignette"></div>
<div id="ui-overlay">
<div id="discovery-banner"></div>
<div id="task-bubble">Task completed!</div>
<div id="day-counter">DAY 1</div>
<div id="day-clock"><canvas id="clock-canvas" width="52" height="56"></canvas></div>
<div id="pause-btn">||</div>
<div id="gallery-btn" title="[LOG]"><span class="btn-glyph">▣</span><span class="btn-label">LOG</span><div id="gallery-badge"></div></div>
<div id="settings-btn" title="[Settings]"><span class="btn-glyph">⚙</span><span class="btn-label">SET</span><div id="settings-badge"></div></div>
<div id="hint-strip"><span id="hint-text"></span></div>
<div id="settings-panel">
<div class="stg-title">┌─ SETTINGS ─┐</div>
<label>Music</label>
<input type="range" id="vol-music" min="0" max="100" value="50">
<label>SFX</label>
<input type="range" id="vol-sfx" min="0" max="100" value="50">
<div id="stg-speed" style="display:none;margin-top:6px;border-top:1px solid #0a3a0a;padding-top:8px;">
<label>Speed</label>
<div style="display:flex;gap:4px;margin-top:4px;">
<button class="speed-btn stg-spd active" data-speed="1">x1</button>
<button class="speed-btn stg-spd" data-speed="2">x2</button>
<button class="speed-btn stg-spd" data-speed="5">x5</button>
<button class="speed-btn stg-spd" data-speed="10">x10</button>
</div>
</div>
</div>
<div id="debug-btn" title="[DEBUG]">&gt;_</div>
<div id="debug-panel"></div>
<div id="speed-control"></div>
</div>
<div id="border-flash"></div>
<div id="gameover-overlay">
<div class="go-flames" id="go-flames-top"></div>
<div class="go-text">The flames have consumed the forest...</div>
<div class="go-days">DAY 0</div>
<div class="go-btn" id="go-restart">AWAKEN</div>
<div class="go-flames" id="go-flames-bot" style="margin-top:20px;"></div>
</div>
<div id="gallery-modal">
<div id="gallery-backdrop"></div>
<div id="gallery-book">
<span id="gallery-close">[X]</span>
<div id="gallery-header">┌──── SPIRIT_GROVE.LOG ────┐</div>
<div id="gallery-tabs">
<div class="gallery-tab active" data-page="tasks">[TASKS]</div>
<div class="gallery-tab" data-page="plants">[FLORA]</div>
<div class="gallery-tab" data-page="animals">[FAUNA]</div>
</div>
<div id="gallery-content"></div>
</div>
</div>
<script src="js/state.js"></script>
<script src="js/world.js"></script>
<script src="js/deer.js"></script>
<script src="js/fire.js"></script>
<script src="js/game.js"></script>
<script src="js/hints.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/input.js"></script>
<script src="js/debug.js"></script>
<script src="js/main.js"></script>
</body>
</html>
